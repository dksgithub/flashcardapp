version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: flashycardy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flashycardy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flashycardy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
